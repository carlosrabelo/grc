name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          skip-cache: true

      - name: Formatação e Vet
        run: |
          go fmt ./...
          go vet ./...

      - name: Testes
        run: go test ./... -count=1

      - name: Build com Hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          go build -o grc-${HASH} ./grc/cmd/grc

      - name: Disponibilizar Pacote
        uses: actions/upload-artifact@v7
        with:
          name: pacote-grc
          path: grc-*
