filters:
  - name: Newsletter
    criteria:
      from: newsletter@example.com
    action:
      label: Newsletters
      markRead: true

  - name: Support Tickets
    criteria:
      subject: "(help OR support OR ticket)"
    action:
      label: Support

  - name: Invoices
    criteria:
      subject: "(invoice OR payment OR receipt)"
    action:
      label: Financeiro
      markRead: true

  - name: Spam
    criteria:
      from: spam@example.com
    action:
      label: Spam
      alwaysSpam: true
